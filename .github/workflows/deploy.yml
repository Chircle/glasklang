name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standard: nur lesen. Schreibrechte bekommt ausschließlich der Deploy-Job.
permissions:
  contents: read

# Immer nur ein Deploy gleichzeitig; ein laufender Deploy wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Übersetzungen prüfen
        run: node tools/check-i18n.mjs

      - name: Firebase-Konfiguration aus Secrets erzeugen
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: node tools/write-config.mjs

      # Nur die Dateien veröffentlichen, die die Website braucht –
      # README, tools/, firestore.rules & Co. bleiben draußen.
      - name: Website zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets data locales _site/

      - uses: actions/configure-pages@v6

      # Eindeutiger Name pro Versuch: Bei „Re-run“ bleibt das Artefakt
      # des vorigen Versuchs sonst liegen und deploy-pages findet zwei.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}